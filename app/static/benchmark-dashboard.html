<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text-to-SQL 评测 · SQLPilot</title><style>
:root{--bg:#071423;--panel:#102237;--panel2:#0a192a;--line:#29435e;--text:#edf6ff;--muted:#8faac2;--green:#35d4ad;--blue:#55a6ff;--warn:#f6bd4b;--danger:#ff7d86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:#071423ed;backdrop-filter:blur(10px);z-index:5}.brand{font-size:21px;font-weight:800}.brand span{color:var(--green)}a{color:#bcd7ef;text-decoration:none;margin-left:20px}.page{padding:26px;max-width:1600px;margin:auto}.headline{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.headline h1{margin:0;font-size:28px}.muted{color:var(--muted)}.refresh{border:0;border-radius:10px;background:var(--green);color:#042119;font-weight:800;padding:10px 16px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}.card{padding:17px}.label{color:var(--muted);font-size:13px}.value{font-size:27px;font-weight:800;margin-top:5px}.value.green{color:var(--green)}.progress{height:12px;background:#06111f;border-radius:8px;overflow:hidden;margin:20px 0 8px}.progress>div{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .4s}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{padding:20px}.panel h2{font-size:18px;margin:0 0 16px}.status-row,.hard-row{display:grid;grid-template-columns:130px 1fr 75px;gap:12px;align-items:center;margin:12px 0}.bar{height:9px;background:#071423;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:5px}.bar.good i{background:var(--green)}.bar.bad i{background:var(--danger)}.toolbar{display:grid;grid-template-columns:1fr 180px 160px 160px;gap:10px;margin:18px 0 12px}input,select{background:#09192b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}.table-wrap{overflow:auto;max-height:650px;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#0b1b2e;color:#abc3d8;position:sticky;top:0}tr{cursor:pointer}tr:hover{background:#142b43}.pill{display:inline-block;padding:3px 8px;border-radius:20px;border:1px solid var(--line);font-size:12px}.matched{color:var(--green);border-color:#28765f}.result_mismatch{color:var(--warn);border-color:#80652b}.pipeline_error{color:var(--danger);border-color:#853f48}.drawer{position:fixed;inset:0;background:#020912a8;display:none;z-index:10}.drawer.open{display:block}.detail{position:absolute;right:0;top:0;height:100%;width:min(720px,92vw);background:#0c1d30;border-left:1px solid var(--line);padding:24px;overflow:auto}.close{float:right;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:9px;padding:7px 11px;cursor:pointer}.detail h2{margin:0 0 3px}.section{margin-top:20px}.section h3{font-size:14px;color:#a9bfd3}.code{white-space:pre-wrap;background:#061321;border:1px solid var(--line);padding:13px;border-radius:10px;color:#d6e8f8;overflow:auto}.event{border-left:2px solid var(--line);padding:3px 0 13px 13px}.empty{text-align:center;color:var(--muted);padding:40px}.error{color:var(--danger)}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:620px){.cards,.toolbar{grid-template-columns:1fr}.page{padding:16px}.top{padding:0 16px}.top nav{display:none}}
</style></head><body><header class="top"><div class="brand"><span>SQL</span>Pilot · 评测中心</div><nav><a href="/">查询</a><a href="/admin/data-sources">数据源</a><a href="/admin/semantic-layer">业务口径</a></nav></header><main class="page"><div class="headline"><div><h1>Spider 全流程评测</h1><div id="meta" class="muted">正在读取评测报告…</div></div><button class="refresh" onclick="load()">立即刷新</button></div><section class="cards"><div class="card"><div class="label">评测进度</div><div id="completed" class="value">--</div></div><div class="card"><div class="label">执行准确率</div><div id="accuracy" class="value green">--</div></div><div class="card"><div class="label">正确数量</div><div id="matched" class="value">--</div></div><div class="card"><div class="label">剩余数量</div><div id="remaining" class="value">--</div></div><div class="card"><div class="label">平均耗时</div><div id="latency" class="value">--</div></div></section><div class="progress"><div id="progressBar"></div></div><div id="progressText" class="muted"></div><section class="grid"><div class="panel"><h2>结果状态</h2><div id="statuses"></div></div><div class="panel"><h2>难度分层准确率</h2><div id="hardness"></div></div></section><section class="panel" style="margin-top:16px"><h2>评测明细 <span id="count" class="muted"></span></h2><div class="toolbar"><input id="search" placeholder="搜索用例、数据库或 SQL"><select id="status"><option value="">全部状态</option><option value="matched">正确</option><option value="result_mismatch">结果不一致</option><option value="pipeline_error">流程错误</option></select><select id="hard"><option value="">全部难度</option><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option><option value="extra">超难</option></select><select id="sort"><option value="case">按用例编号</option><option value="slow">耗时从高到低</option><option value="failed">失败优先</option></select></div><div class="table-wrap"><table><thead><tr><th>用例</th><th>数据库</th><th>难度</th><th>状态</th><th>耗时</th><th>生成 SQL</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="drawer" class="drawer" onclick="if(event.target===this)closeDetail()"><aside class="detail"><button class="close" onclick="closeDetail()">关闭</button><div id="detail"></div></aside></div><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let data={cases:[]};const names={matched:'正确',result_mismatch:'结果不一致',pipeline_error:'流程错误'},hardNames={easy:'简单',medium:'中等',hard:'困难',extra:'超难'};
function pct(v){return `${(Number(v||0)*100).toFixed(2)}%`}function duration(ms){return ms?`${(ms/1000).toFixed(1)} 秒`:'--'}function rowBar(label,value,total,kind=''){const p=total?value/total:0;return`<div class="status-row"><span>${esc(label)}</span><div class="bar ${kind}"><i style="width:${p*100}%"></i></div><b>${value}</b></div>`}
async function load(){try{const run=$('#run')?.value||'baseline',r=await fetch(`/api/v1/benchmarks/spider/current?run=${encodeURIComponent(run)}`,{cache:'no-store'}),body=await r.json();if(!r.ok)throw new Error(body.error?.message||'报告读取失败');data=body.data;render()}catch(e){$('#meta').innerHTML=`<span class="error">${esc(e.message)}</span>，将在一分钟后重试`}}
async function loadRuns(){const r=await fetch('/api/v1/benchmarks/spider/runs',{cache:'no-store'}),body=await r.json();if(!r.ok)throw new Error(body.error?.message||'批次读取失败');const select=document.createElement('select');select.id='run';select.setAttribute('aria-label','评测批次');select.innerHTML=body.data.map(v=>`<option value="${esc(v.id)}">${esc(v.label)}</option>`).join('');select.addEventListener('change',load);$('.refresh').before(select,document.createTextNode(' '))}
function render(){const d=data;$('#meta').textContent=`${d.benchmark||''} · ${d.model} · 更新于 ${new Date(d.updated_at*1000).toLocaleString()}`;$('#completed').textContent=`${d.completed} / ${d.expected_total}`;$('#accuracy').textContent=pct(d.execution_accuracy);$('#matched').textContent=d.matched;$('#remaining').textContent=d.remaining;$('#latency').textContent=duration(d.average_elapsed_ms);$('#progressBar').style.width=pct(d.progress);$('#progressText').textContent=`已完成 ${pct(d.progress)}，页面每分钟自动刷新`;$('#statuses').innerHTML=Object.entries(d.status_counts||{}).map(([k,v])=>rowBar(names[k]||k,v,d.completed,k==='matched'?'good':'bad')).join('')||'<div class="empty">暂无数据</div>';$('#hardness').innerHTML=Object.entries(d.by_hardness||{}).map(([k,v])=>`<div class="hard-row"><span>${hardNames[k]||k}</span><div class="bar good"><i style="width:${v.total?v.matched/v.total*100:0}%"></i></div><b>${v.total?pct(v.matched/v.total):'--'}</b></div>`).join('');renderRows()}
function filtered(){const q=$('#search').value.toLowerCase(),status=$('#status').value,hard=$('#hard').value;let rows=data.cases.filter(v=>(!status||v.status===status)&&(!hard||v.hardness===hard)&&(!q||[v.case_id,v.db_id,v.sql,v.question].some(x=>String(x||'').toLowerCase().includes(q))));if($('#sort').value==='slow')rows.sort((a,b)=>(b.elapsed_ms||0)-(a.elapsed_ms||0));else if($('#sort').value==='failed')rows.sort((a,b)=>(a.matched===b.matched?0:a.matched?1:-1));else rows.sort((a,b)=>a.case_id.localeCompare(b.case_id));return rows}
function renderRows(){const rows=filtered();$('#count').textContent=`（${rows.length} 条）`;$('#rows').innerHTML=rows.length?rows.map(v=>`<tr onclick="showDetail('${esc(v.case_id)}')"><td><b>${esc(v.case_id)}</b></td><td>${esc(v.db_id)}</td><td>${esc(hardNames[v.hardness]||v.hardness)}</td><td><span class="pill ${esc(v.status)}">${esc(names[v.status]||v.status)}</span></td><td>${duration(v.elapsed_ms)}</td><td>${esc(v.sql||v.error||'--')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">没有符合条件的用例</td></tr>'}
function showDetail(id){const v=data.cases.find(x=>x.case_id===id);if(!v)return;const plan=(v.events||[]).find(x=>x.stage==='plan_created')?.plan;$('#detail').innerHTML=`<h2>${esc(v.case_id)}</h2><div class="muted">${esc(v.db_id)} · ${esc(hardNames[v.hardness]||v.hardness)} · ${duration(v.elapsed_ms)}</div><div class="section"><h3>执行状态</h3><span class="pill ${esc(v.status)}">${esc(names[v.status]||v.status)}</span></div>${v.question?`<div class="section"><h3>用户问题</h3><div>${esc(v.question)}</div></div>`:''}<div class="section"><h3>生成 SQL</h3><div class="code">${esc(v.sql||v.error||'未生成')}</div></div>${plan?`<div class="section"><h3>查询计划</h3><div class="code">${esc(JSON.stringify(plan,null,2))}</div></div>`:''}<div class="section"><h3>执行阶段</h3>${(v.events||[]).map(e=>`<div class="event"><b>${esc(e.stage)}</b><div class="muted">${esc(JSON.stringify(e))}</div></div>`).join('')||'<div class="muted">无阶段信息</div>'}</div>`;$('#drawer').classList.add('open')}
function closeDetail(){$('#drawer').classList.remove('open')}['search','status','hard','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',renderRows));loadRuns().then(load).catch(e=>{$('#meta').innerHTML=`<span class="error">${esc(e.message)}</span>`});setInterval(load,60000);
</script></body></html>
