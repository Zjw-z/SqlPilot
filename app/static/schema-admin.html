<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQLPilot · Schema管理</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d2e;--panel2:#14243a;--line:#263a52;--muted:#91a6bd;--text:#edf5fc;--accent:#36d6a5;--danger:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}.top{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#0a1625}.brand{font-size:19px;font-weight:800}.brand span{color:var(--accent)}a{color:var(--muted);text-decoration:none}.page{padding:24px 28px}.intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.intro h1{margin:0;font-size:26px}.intro p{margin:4px 0 0;color:var(--muted)}.badge{padding:6px 10px;border-radius:99px;background:#123b35;color:var(--accent)}.toolbar{display:flex;gap:10px;margin-bottom:16px}.search{flex:1;max-width:520px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#0d1b2c;color:var(--text)}button{font:inherit}.button{border:0;border-radius:10px;padding:10px 15px;background:var(--accent);color:#05231a;font-weight:700;cursor:pointer}.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;min-height:calc(100vh - 190px)}.tables,.detail{border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:auto}.table-item{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}.table-item:hover,.table-item.active{background:var(--panel2)}.table-name{font-weight:700}.table-meta{font-size:12px;color:var(--muted)}.detail{padding:20px}.empty{height:100%;display:grid;place-items:center;color:var(--muted)}.detail-head{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}.detail-head h2{margin:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#0b1828;color:var(--text)}.field textarea{min-height:70px;resize:vertical}.toggle{display:flex;gap:8px;align-items:center}.columns{margin-top:20px}.column{border:1px solid var(--line);border-radius:11px;margin:9px 0;overflow:hidden}.column-summary{padding:10px 12px;background:#0b1828;display:flex;justify-content:space-between;cursor:pointer}.column-body{padding:13px}.status{color:var(--accent)}.disabled{color:var(--danger)}.notice{position:fixed;right:22px;bottom:22px;padding:11px 16px;border-radius:10px;background:#173d35;color:#bdf5e4;display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.tables{max-height:260px}.fields{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand"><span>SQL</span>Pilot · Schema管理</div><a href="/">← 返回自然语言查询</a></header><main class="page"><div class="intro"><div><h1>业务数据目录</h1><p>维护业务语义会直接影响Schema RAG检索、SQL生成范围和结果可信度。</p></div><div class="badge" id="strategy">正在读取目录…</div></div><div class="toolbar"><input class="search" id="search" placeholder="搜索表名、字段名或中文说明"><button class="button" onclick="loadCatalog()">刷新数据库结构</button></div><div class="layout"><section class="tables" id="tables"></section><section class="detail" id="detail"><div class="empty">从左侧选择一张表进行维护</div></section></div></main><div class="notice" id="notice">保存成功，新的语义已用于RAG检索</div><script>
let catalog=[],current=null;const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(path,options={}){const response=await fetch(path,{headers:{'content-type':'application/json'},...options});const body=await response.json();if(body.error)throw new Error(body.error.message);return body.data}
async function loadCatalog(){try{const data=await api('/api/v1/schema/catalog');catalog=data.tables;$('#strategy').textContent=`动态目录 · ${catalog.length} 张表`;renderTables();if(current){current=catalog.find(t=>t.name===current.name);if(current)renderDetail(current)}}catch(error){$('#strategy').textContent=error.message}}
function renderTables(){const q=$('#search').value.trim().toLowerCase();const items=catalog.filter(t=>JSON.stringify(t).toLowerCase().includes(q));$('#tables').innerHTML=items.map(t=>`<div class="table-item ${current?.name===t.name?'active':''}" onclick="selectTable('${esc(t.name)}')"><div class="table-name">${esc(t.display_name||t.database_comment||t.name)}</div><div class="table-meta">${esc(t.schema)}.${esc(t.name)} · ${t.columns.length} 个字段 · <span class="${t.enabled?'status':'disabled'}">${t.enabled?'已启用':'已停用'}</span></div></div>`).join('')||'<div class="empty">没有匹配的数据表</div>'}
function selectTable(name){current=catalog.find(t=>t.name===name);renderTables();renderDetail(current)}function input(id,label,value,type='input'){return`<div class="field"><label>${label}</label>${type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}">`}</div>`}
function renderDetail(t){$('#detail').innerHTML=`<div class="detail-head"><div><h2>${esc(t.display_name||t.database_comment||t.name)}</h2><div class="table-meta">${esc(t.schema)}.${esc(t.name)}</div></div><label class="toggle"><input id="tableEnabled" type="checkbox" ${t.enabled?'checked':''}> 允许RAG检索</label></div><div class="fields">${input('tableDisplay','业务中文名',t.display_name)}${input('tableAliases','业务别名（逗号分隔）',t.aliases.join('，'))}${input('tableDescription','业务说明',t.description||t.database_comment,'textarea')}</div><button class="button" style="margin-top:14px" onclick="saveTable()">保存表配置</button><div class="columns"><h3>字段配置</h3>${t.columns.map((c,i)=>`<details class="column"><summary class="column-summary"><span><b>${esc(c.display_name||c.database_comment||c.name)}</b> <span class="table-meta">${esc(c.name)} · ${esc(c.data_type)}</span></span><span class="${c.enabled?'status':'disabled'}">${c.enabled?'已启用':'已停用'}</span></summary><div class="column-body"><div class="fields">${input(`cd-${i}`,'字段中文名',c.display_name)}${input(`ca-${i}`,'业务别名（逗号分隔）',c.aliases.join('，'))}${input(`cc-${i}`,'业务说明',c.description||c.database_comment,'textarea')}<label class="toggle"><input id="ce-${i}" type="checkbox" ${c.enabled?'checked':''}> 允许用于SQL生成</label></div><button class="button" style="margin-top:12px" onclick="saveColumn(${i})">保存字段配置</button></div></details>`).join('')}</div>`}
const aliases=value=>value.split(/[,，]/).map(v=>v.trim()).filter(Boolean);async function save(payload){await api('/api/v1/schema/catalog',{method:'PUT',body:JSON.stringify(payload)});const n=$('#notice');n.style.display='block';setTimeout(()=>n.style.display='none',1800);await loadCatalog()}async function saveTable(){await save({schema_name:current.schema,table_name:current.name,column_name:'',display_name:$('#tableDisplay').value,description:$('#tableDescription').value,aliases:aliases($('#tableAliases').value),enabled:$('#tableEnabled').checked})}async function saveColumn(i){const c=current.columns[i];await save({schema_name:current.schema,table_name:current.name,column_name:c.name,display_name:$(`#cd-${i}`).value,description:$(`#cc-${i}`).value,aliases:aliases($(`#ca-${i}`).value),enabled:$(`#ce-${i}`).checked})}$('#search').addEventListener('input',renderTables);loadCatalog();
</script></body></html>
