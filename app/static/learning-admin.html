<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SQLPilot · 学习与查询路径</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d2e;--line:#263a52;--muted:#91a6bd;--text:#edf5fc;--accent:#36d6a5;--warn:#ffca65;--danger:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:#0a1625}.brand{font-size:18px;font-weight:800}.brand span{color:var(--accent)}a{color:var(--muted);text-decoration:none;margin-left:18px}.page{max-width:1320px;margin:auto;padding:28px 24px}.head{display:flex;align-items:start;justify-content:space-between;gap:20px}.head h1{margin:0;font-size:28px}.muted{color:var(--muted)}.notice{margin:18px 0;padding:13px 16px;border:1px solid #4d633b;border-radius:12px;background:#12271f;color:#bfe7d3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:300px}.panel h2{margin:0 0 4px}.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item-head{display:flex;justify-content:space-between;gap:12px}.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:#1c3045;color:var(--muted)}.badge.certified{background:#123b35;color:var(--accent)}.badge.stale{background:#3b321d;color:var(--warn)}.actions{display:flex;gap:8px;margin-top:9px}.actions button,.refresh{border:1px solid var(--line);border-radius:8px;background:#15253a;color:var(--text);padding:8px 11px;cursor:pointer}.actions .approve{border-color:#27775f;color:var(--accent)}.actions .reject{color:var(--danger)}.empty{padding:35px;text-align:center;color:var(--muted)}.deps{margin-top:6px;color:var(--muted);font-size:12px}.stats{display:flex;gap:12px;margin:12px 0}.stat{padding:8px 11px;background:#0b1828;border-radius:9px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand"><span>SQL</span>Pilot · 学习中心</div><nav><a href="/">查询</a><a href="/admin/memory/legacy">业务记忆</a><a href="/admin/semantic-layer">业务口径</a><a href="/admin/data-sources">数据源</a></nav></header>
<main class="page"><div class="head"><div><h1>审核式学习与查询路径</h1><div class="muted">把真实正确查询沉淀为可复用路径，同时保持人工审核和Schema版本隔离。</div></div><button class="refresh" onclick="load()">刷新</button></div>
<div class="notice">用户点击“结果正确”只会生成待审核草稿。审核通过且Schema指纹一致时，路径才会被后续需求分析优先复用。</div>
<div class="stats" id="stats"></div><div class="grid"><section class="panel"><h2>待审核反馈</h2><div class="muted">核对结果、口径和字段绑定后再通过。</div><div id="feedback"></div></section><section class="panel"><h2>查询路径库</h2><div class="muted">保存计划、字段、表关系和Schema指纹，不以裸SQL绕过安全校验。</div><div id="paths"></div></section></div></main>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch(path,{headers:{'content-type':'application/json'},...options}),b=await r.json();if(b.error)throw new Error(b.error.message);return b.data}
const statusLabel={draft:'待审核',certified:'已认证',stale:'Schema已变更',disabled:'已停用'};
async function load(){try{const[f,p]=await Promise.all([api('/api/v1/learning/feedback?status=pending'),api('/api/v1/learning/query-paths')]);$('#stats').innerHTML=`<div class="stat">待审核 ${f.length}</div><div class="stat">已认证 ${p.filter(v=>v.status==='certified').length}</div><div class="stat">需重新验证 ${p.filter(v=>v.status==='stale').length}</div>`;$('#feedback').innerHTML=f.length?f.map(v=>`<div class="item"><div class="item-head"><b>${v.verdict==='correct'?'用户确认结果正确':'用户反馈结果有问题'}</b><span class="badge">${esc(v.issue_type||'待复核')}</span></div><div class="deps">执行 ${esc(v.execution_id)}</div>${v.comment?`<div>${esc(v.comment)}</div>`:''}<div class="actions"><button class="approve" onclick="review('${v.id}','approve')">审核通过</button><button class="reject" onclick="review('${v.id}','reject')">驳回</button></div></div>`).join(''):'<div class="empty">当前没有待审核项。请先在查询结果底部点击“结果正确”或“反馈问题”。</div>';$('#paths').innerHTML=p.length?p.map(v=>`<div class="item"><div class="item-head"><b>${esc(v.title)}</b><span class="badge ${esc(v.status)}">${statusLabel[v.status]||esc(v.status)}</span></div><div>${esc(v.question)}</div><div class="deps">确认 ${v.confirmation_count} 次 · 成功 ${v.success_count} 次 · 依赖 ${(v.dependencies?.objects||[]).length} 个字段</div>${v.reviewer?`<div class="deps">审核人：${esc(v.reviewer)}</div>`:''}${v.review_note?`<div class="deps">审核说明：${esc(v.review_note)}</div>`:''}</div>`).join(''):'<div class="empty">还没有可复用查询路径</div>'}catch(e){alert(e.message)}}
async function review(id,decision){const note=prompt(decision==='approve'?'审核备注（可选）':'驳回原因（可选）','')||'';await api('/api/v1/learning/feedback/'+id+'/review',{method:'POST',body:JSON.stringify({decision,note})});load()}
load();
</script></body></html>
