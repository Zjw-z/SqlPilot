<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQLPilot · 记忆管理</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d2e;--line:#263a52;--muted:#91a6bd;--text:#edf5fc;--accent:#36d6a5;--warn:#ffca65;--danger:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:#0a1625}.brand{font-size:18px;font-weight:800}.brand span{color:var(--accent)}a{color:var(--muted);text-decoration:none;margin-left:18px}.page{max-width:1200px;margin:auto;padding:30px 24px}.head{display:flex;justify-content:space-between;gap:20px;align-items:start}.head h1{margin:0;font-size:28px}.muted{color:var(--muted)}.notice{margin:18px 0;padding:13px 16px;border:1px solid #4d633b;border-radius:12px;background:#12271f;color:#bfe7d3}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.panel h2{margin:0 0 4px}.form{display:grid;gap:10px;margin:16px 0}input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#091626;color:var(--text);font:inherit}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:9px}.button{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#05231a;font-weight:800;cursor:pointer}.secondary{background:#15253a;color:var(--text);border:1px solid var(--line)}.danger{color:var(--danger)}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item-head{display:flex;justify-content:space-between;gap:12px}.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:#1c3045;color:var(--muted)}.badge.certified{background:#123b35;color:var(--accent)}.actions{margin-top:8px}.actions button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 14px 0 0}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand"><span>SQL</span>Pilot · 记忆管理</div><nav><a href="/">查询</a><a href="/admin/data-sources">数据源</a><a href="/admin/semantic-layer">业务口径</a></nav></header><main class="page"><div class="head"><div><h1>记忆管理</h1><div class="muted">管理跨查询可复用的偏好和经过治理的业务知识</div></div></div><div class="notice">普通聊天和临时回答只保留在当前会话。只有标记为“已认证”的业务记忆才会进入后续需求分析。</div><div class="grid"><section class="panel"><h2>我的偏好</h2><div class="muted">用于展示和默认选择，用户本轮明确要求始终优先。</div><form class="form" onsubmit="savePreference(event)"><input id="prefKey" required placeholder="键，例如 chart.preference"><input id="prefValue" required placeholder="值，例如 line"><button class="button">保存偏好</button></form><div id="preferences"></div></section><section class="panel"><h2>业务记忆</h2><div class="muted">字段口径、业务规则和高质量查询样例需人工认证。</div><form class="form" onsubmit="saveBusiness(event)"><div class="row"><input id="memoryKey" required placeholder="唯一键，例如 inpatient.fund_total"><select id="category"><option value="metric_definition">指标定义</option><option value="dimension_definition">维度定义</option><option value="business_rule">业务规则</option><option value="field_mapping">字段映射</option><option value="query_example">查询样例</option></select></div><input id="title" required placeholder="标题"><textarea id="content" required placeholder="明确描述定义、聚合方式、过滤规则或字段映射"></textarea><input id="evidence" placeholder="依据或负责人（推荐填写）"><div class="row"><select id="status"><option value="draft">草稿（不进入模型）</option><option value="certified">已认证（可进入模型）</option><option value="disabled">已停用</option></select><button class="button">保存业务记忆</button></div></form><div id="business"></div></section></div></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options={}){const r=await fetch(path,{headers:{'content-type':'application/json'},...options}),b=await r.json();if(b.error)throw new Error(b.error.message);return b.data}async function load(){const[p,b]=await Promise.all([api('/api/v1/memory/preferences'),api('/api/v1/memory/business')]);$('#preferences').innerHTML=p.length?p.map(v=>`<div class="item"><div class="item-head"><b>${esc(v.key)}</b><span class="badge ${v.enabled?'certified':''}">${v.enabled?'启用':'停用'}</span></div><div>${esc(typeof v.value==='string'?v.value:JSON.stringify(v.value))}</div><div class="actions"><button onclick='togglePreference(${JSON.stringify(v)})'>${v.enabled?'停用':'启用'}</button></div></div>`).join(''):'<div class="empty">还没有个人偏好</div>';$('#business').innerHTML=b.length?b.map(v=>`<div class="item"><div class="item-head"><div><b>${esc(v.title)}</b><div class="muted">${esc(v.key)} · V${v.version}</div></div><span class="badge ${v.status==='certified'?'certified':''}">${({draft:'草稿',certified:'已认证',disabled:'已停用'})[v.status]}</span></div><div>${esc(v.content)}</div>${v.evidence?`<div class="muted">依据：${esc(v.evidence)}</div>`:''}<div class="actions"><button onclick='editBusiness(${JSON.stringify(v)})'>编辑</button><button class="danger" onclick="removeBusiness('${v.id}')">删除</button></div></div>`).join(''):'<div class="empty">还没有业务记忆</div>'}async function savePreference(e){e.preventDefault();let value=$('#prefValue').value.trim();try{value=JSON.parse(value)}catch{}await api('/api/v1/memory/preferences',{method:'PUT',body:JSON.stringify({key:$('#prefKey').value.trim(),value,enabled:true})});e.target.reset();load()}async function togglePreference(v){await api('/api/v1/memory/preferences',{method:'PUT',body:JSON.stringify({key:v.key,value:v.value,enabled:!v.enabled})});load()}async function saveBusiness(e){e.preventDefault();await api('/api/v1/memory/business',{method:'PUT',body:JSON.stringify({key:$('#memoryKey').value.trim(),category:$('#category').value,title:$('#title').value.trim(),content:$('#content').value.trim(),evidence:$('#evidence').value.trim(),status:$('#status').value})});e.target.reset();load()}function editBusiness(v){$('#memoryKey').value=v.key;$('#memoryKey').readOnly=true;$('#category').value=v.category;$('#title').value=v.title;$('#content').value=v.content;$('#evidence').value=v.evidence||'';$('#status').value=v.status;scrollTo({top:0,behavior:'smooth'})}async function removeBusiness(id){if(!confirm('确认删除这条业务记忆？'))return;await api('/api/v1/memory/business/'+id,{method:'DELETE'});load()}load().catch(e=>alert(e.message));
</script></body></html>
