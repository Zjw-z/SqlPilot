<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理 · SQLPilot</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d2e;--line:#263a52;--muted:#91a6bd;--text:#edf5fc;--accent:#36d6a5;--danger:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{height:62px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:var(--muted);text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:30px 24px}.head{display:flex;justify-content:space-between;align-items:flex-start}.muted{color:var(--muted)}button{border:1px solid var(--line);background:#14243a;color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}.primary{background:var(--accent);color:#05231a;border:0;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-top:22px}.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:17px}.row{display:flex;justify-content:space-between;gap:12px}.badge{padding:2px 8px;border-radius:99px;background:#173147;color:var(--muted);font-size:12px}.badge.active{background:#12352d;color:var(--accent)}.actions{display:flex;gap:8px;margin-top:14px}.modal{position:fixed;inset:0;background:#020812cc;display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(460px,100%);padding:24px;border:1px solid var(--line);border-radius:16px;background:#101d2e}label{display:block;margin-top:12px;color:var(--muted)}input,select{width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:9px;background:#091523;color:var(--text)}
</style></head><body><header><b><span style="color:var(--accent)">SQL</span>Pilot · 用户管理</b><nav><a href="/">返回查询</a></nav></header><main class="wrap"><div class="head"><div><h1 style="margin:0">用户与访问权限</h1><div class="muted">每个用户只读取自己的会话、计划、SQL和查询结果</div></div><button class="primary" onclick="openCreate()">新建用户</button></div><div id="list" class="grid"></div></main><div id="modal" class="modal"><form class="dialog" onsubmit="createUser(event)"><div class="row"><h2 style="margin:0">新建用户</h2><button type="button" onclick="closeModal()">关闭</button></div><label>用户名<input id="username" pattern="[a-zA-Z0-9_.-]+" minlength="3" required></label><label>显示名称<input id="displayName" required></label><label>初始密码<input id="password" type="password" minlength="8" required></label><label>角色<select id="role"><option value="analyst">分析人员</option><option value="admin">管理员</option></select></label><button class="primary" style="width:100%;margin-top:18px">创建用户</button></form></div><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options={}){const r=await fetch(path,{headers:{'content-type':'application/json'},...options}),b=await r.json();if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname);throw new Error('请登录')}if(!r.ok||b.error)throw new Error(b.error?.message||'请求失败');return b.data}async function load(){try{const rows=await api('/api/v1/users');$('#list').innerHTML=rows.map(v=>`<article class="card"><div class="row"><div><b>${esc(v.display_name)}</b><div class="muted">${esc(v.username)} · ${v.role==='admin'?'管理员':'分析人员'}</div></div><span class="badge ${v.status}">${v.status==='active'?'启用':'停用'}</span></div><div class="muted" style="margin-top:10px">最近登录：${v.last_login_at?new Date(v.last_login_at).toLocaleString():'从未登录'}</div><div class="actions"><button onclick="toggle('${v.id}','${v.status}')">${v.status==='active'?'停用':'启用'}</button><button onclick="resetPassword('${v.id}')">重置密码</button></div></article>`).join('')||'<div class="muted">暂无用户</div>'}catch(e){$('#list').innerHTML='<div style="color:var(--danger)">'+esc(e.message)+'</div>'}}function openCreate(){$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}async function createUser(e){e.preventDefault();await api('/api/v1/users',{method:'POST',body:JSON.stringify({username:$('#username').value,display_name:$('#displayName').value,password:$('#password').value,role:$('#role').value})});closeModal();e.target.reset();load()}async function toggle(id,status){await api('/api/v1/users/'+id,{method:'PATCH',body:JSON.stringify({status:status==='active'?'disabled':'active'})});load()}async function resetPassword(id){const password=prompt('请输入不少于8位的新初始密码');if(!password)return;await api('/api/v1/users/'+id,{method:'PATCH',body:JSON.stringify({password})});alert('密码已重置，该用户需要重新登录并修改密码');load()}load();
</script></body></html>
