<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQLPilot · 数据源</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d2e;--panel2:#14243a;--line:#263a52;--muted:#91a6bd;--text:#edf5fc;--accent:#36d6a5;--warn:#ffca65;--danger:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}.top{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#0a1625}.brand{font-size:19px;font-weight:800}.brand span{color:var(--accent)}a{color:var(--muted);text-decoration:none}.page{padding:26px;max-width:1280px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h1{margin:0}.head p{color:var(--muted);margin:4px 0}.button{border:0;border-radius:10px;padding:10px 15px;background:var(--accent);color:#05231a;font-weight:750;cursor:pointer}.secondary{background:#14243a;color:var(--text);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:15px}.card{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:18px}.card h3{margin:0}.meta{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.status{padding:4px 9px;border-radius:99px;background:#182a3d;color:var(--muted)}.status.ready{background:#123b35;color:var(--accent)}.status.failed{background:#3b2028;color:var(--danger)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.fact{background:#0b1828;padding:9px;border-radius:8px}.tools{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.tool{font-size:11px;border:1px solid var(--line);padding:3px 7px;border-radius:99px;color:#b9cce0}.actions{display:flex;gap:8px;margin-top:14px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px}.dialog{width:min(680px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.dialog h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0b1828;color:var(--text)}.full{grid-column:1/-1}.progress{height:7px;border-radius:99px;background:#0b1828;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--accent)}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:600px){.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header class="top"><div class="brand"><span>SQL</span>Pilot · 数据源</div><div><a href="/admin/schema">Schema治理</a>　<a href="/">返回查询</a></div></header><main class="page"><div class="head"><div><h1>数据源与知识库</h1><p>连接数据库后，系统自动扫描Schema、构建RAG知识库并注册查询工具。</p></div><button class="button" onclick="openDialog()">接入数据源</button></div><div id="sources" class="grid"></div></main><div class="modal" id="modal"><form class="dialog" onsubmit="createSource(event)"><div class="row"><h2>接入PostgreSQL</h2><button type="button" class="button secondary" onclick="closeDialog()">关闭</button></div><div class="fields"><div class="field full"><label>数据源名称</label><input id="name" required placeholder="例如：医保生产分析库"></div><div class="field"><label>主机地址</label><input id="host" required value="127.0.0.1"></div><div class="field"><label>端口</label><input id="port" type="number" required value="5432"></div><div class="field"><label>数据库</label><input id="database" required></div><div class="field"><label>Schema（逗号分隔）</label><input id="schemas" required value="public"></div><div class="field"><label>只读用户名</label><input id="username" required></div><div class="field"><label>密码</label><input id="password" type="password" required autocomplete="new-password"></div></div><p class="meta">密码使用当前Windows账户的DPAPI加密保存，不会返回前端或写入RAG知识文档。</p><button class="button" type="submit" id="create">验证连接并保存</button></form></div><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(path,options={}){const r=await fetch(path,{headers:{'content-type':'application/json'},...options});const b=await r.json();if(b.error)throw new Error(b.error.message);return b.data}const statusText={draft:'待配置',connecting:'正在连接',connected:'待构建知识库',ready:'已就绪',failed:'失败'};
async function load(){try{const rows=await api('/api/v1/data-sources');$('#sources').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">还没有数据源，点击“接入数据源”开始自动搭建。</div>'}catch(e){$('#sources').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}function card(s){const policy=(s.business_rules||[]).length?'有效结算、排除撤销':'未配置';return`<article class="card"><div class="row"><div><h3>${esc(s.name)}</h3><div class="meta">${esc(s.database_type)} · ${esc(s.host)}:${s.port}/${esc(s.database_name)}</div></div><span class="status ${s.status}">${statusText[s.status]||s.status}</span></div><div class="facts"><div class="fact"><div class="meta">Schema</div>${esc(s.schemas.join('、'))}</div><div class="fact"><div class="meta">知识库版本</div>${esc(s.schema_version||'尚未构建')}</div><div class="fact"><div class="meta">认证业务口径</div>${esc(policy)}</div></div>${s.last_error?`<div style="color:var(--danger)">${esc(s.last_error)}</div>`:''}<div class="tools">${s.tools.map(t=>`<span class="tool">${esc(t)}</span>`).join('')}</div><div id="job-${s.id}"></div><div class="actions"><button class="button secondary" onclick="testSource('${s.id}')">测试连接</button><button class="button" onclick="syncSource('${s.id}')">${s.status==='ready'?'同步结构':'构建知识库'}</button><button class="button secondary" onclick="configureRules('${s.id}',${esc(JSON.stringify(s.business_rules||[]))})">业务口径</button>${s.status==='ready'?`<button class="button secondary" onclick="searchSource('${s.id}')">测试检索</button>`:''}</div></article>`}
function openDialog(){$('#modal').style.display='grid'}function closeDialog(){$('#modal').style.display='none'}async function createSource(e){e.preventDefault();const button=$('#create');button.disabled=true;try{await api('/api/v1/data-sources',{method:'POST',body:JSON.stringify({name:$('#name').value,database_type:'postgresql',host:$('#host').value,port:Number($('#port').value),database_name:$('#database').value,schemas:$('#schemas').value.split(/[,，]/).map(v=>v.trim()).filter(Boolean),username:$('#username').value,password:$('#password').value})});closeDialog();e.target.reset();await load()}catch(err){alert(err.message)}finally{button.disabled=false}}async function testSource(id){try{const r=await api(`/api/v1/data-sources/${id}/test`,{method:'POST'});alert(`连接成功\n${r.database_version}\n默认只读：${r.default_read_only}`)}catch(e){alert(e.message)}}async function syncSource(id){const box=$(`#job-${id}`);box.innerHTML='<div class="meta">正在扫描结构并构建知识库…</div><div class="progress"><i style="width:25%"></i></div>';try{const r=await api(`/api/v1/data-sources/${id}/sync`,{method:'POST'});box.innerHTML=`<div class="meta">完成：${r.table_count}张表、${r.column_count}个字段、${r.document_count}篇知识文档</div><div class="progress"><i style="width:100%"></i></div>`;setTimeout(load,900)}catch(e){box.innerHTML=`<div style="color:var(--danger)">${esc(e.message)}</div>`}}async function configureRules(id,current=[]){const valid=confirm(`配置数据源认证口径\n\n确定：启用“仅包含有效结算、排除已撤销记录”\n取消：清空默认业务口径\n\n只有已核验字段和码值的数据源才应启用。`),rules=valid?['valid_settlement_only','exclude_cancelled']:[];await api(`/api/v1/data-sources/${id}/business-rules`,{method:'PUT',body:JSON.stringify({business_rules:rules})});await load()}function searchSource(id){document.querySelector('#searchModal')?.remove();const modal=document.createElement('div');modal.id='searchModal';modal.className='modal';modal.style.display='grid';modal.innerHTML=`<div class="dialog" style="width:min(860px,100%);max-height:88vh;overflow:auto"><div class="row"><div><h2 style="margin:0">测试Schema RAG检索</h2><div class="meta">查看业务语义召回及潜在口径冲突</div></div><button class="button secondary" onclick="document.querySelector('#searchModal').remove()">关闭</button></div><div style="display:flex;gap:8px;margin:18px 0"><input id="ragQuery" class="search" style="max-width:none" value="医保基金支付和住院结算人次"><button class="button" onclick="runSchemaSearch('${id}')">开始检索</button></div><div id="ragResults" class="meta">输入业务问题后开始检索。</div></div>`;document.body.appendChild(modal);setTimeout(()=>$('#ragQuery').focus(),0)}async function runSchemaSearch(id){const q=$('#ragQuery').value.trim(),box=$('#ragResults');if(!q)return;box.innerHTML='正在进行关键词与向量混合检索…';try{const rows=await api(`/api/v1/data-sources/${id}/knowledge/search?q=${encodeURIComponent(q)}`);const ambiguous=rows.some(v=>v.requires_confirmation);const warning=ambiguous?'<div style="padding:12px;border:1px solid #745e28;border-radius:10px;background:#292214;color:var(--warn);margin-bottom:12px"><b>检测到相近的业务口径</b><div>多个字段匹配程度非常接近，正式查询时需要结合认证指标或由用户确认，不能直接采用第一名。</div></div>':'';box.innerHTML=warning+(rows.length?rows.slice(0,10).map((v,i)=>{const raw=v.metadata?.column_comment||v.metadata?.table_comment||'',name=v.business_name||raw.split('；')[0]||v.object_key;return`<article style="padding:13px 0;border-bottom:1px solid var(--line)"><div class="row"><div><b>${i+1}. ${esc(name)}</b><div class="meta">来源：${esc(v.schema_name)}.${esc(v.table_name)}${v.column_name?'.'+esc(v.column_name):''}</div></div><span class="status ${v.requires_confirmation?'failed':'ready'}">${v.requires_confirmation?'待确认口径':esc(v.match_level)}</span></div><div style="margin-top:7px;color:#bed0e2">${esc(raw||v.content)}</div><details class="meta" style="margin-top:7px"><summary>技术匹配详情</summary><div>综合得分 ${v.score} · 向量得分 ${v.vector_score} · 关键词得分 ${v.lexical_score}</div><div>${esc(v.object_key)}</div></details></article>`}).join(''):'<div class="empty">没有召回相关Schema</div>')}catch(e){box.innerHTML=`<div style="color:var(--danger)">${esc(e.message)}</div>`}}document.querySelector('.dialog .meta').textContent='密码使用应用密钥加密保存，不会返回前端或写入RAG知识文档。';load();
function installRagStyles(){const style=document.createElement('style');style.textContent=`
#searchModal{backdrop-filter:blur(5px);padding:28px}.rag-dialog{width:min(920px,100%);max-height:88vh;overflow:hidden;display:grid;grid-template-rows:auto auto minmax(180px,1fr);padding:0;border-radius:18px;box-shadow:0 24px 80px #0009}.rag-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:24px 26px 18px;border-bottom:1px solid var(--line)}.rag-kicker{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:800}.rag-header h2{margin:3px 0 2px;font-size:22px}.rag-close{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#0b1828;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}.rag-close:hover{color:var(--text);background:var(--panel2)}.rag-search-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:18px 26px;background:#0d1929}.rag-query{width:100%;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#071421;color:var(--text);outline:none}.rag-query:focus{border-color:var(--accent);box-shadow:0 0 0 3px #36d6a51a}.rag-results{overflow:auto;padding:18px 26px 24px}.rag-empty{min-height:170px;display:grid;place-items:center;text-align:center;color:var(--muted)}.rag-empty-icon{width:46px;height:46px;margin:auto auto 10px;border-radius:14px;background:#123b35;display:grid;place-items:center;color:var(--accent);font-size:22px}.rag-warning{padding:13px 15px;border:1px solid #745e28;border-radius:11px;background:#292214;color:#f6d98c;margin-bottom:13px}.rag-warning b{display:block;color:var(--warn);margin-bottom:2px}.rag-count{font-size:12px;color:var(--muted);margin:0 0 9px}.rag-item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:start;padding:14px 4px;border-bottom:1px solid var(--line)}.rag-rank{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#0b1828;color:var(--muted);font-size:12px}.rag-name{font-size:15px;font-weight:750}.rag-source{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}.rag-description{margin-top:5px;color:#bed0e2}.rag-badge{padding:4px 8px;border-radius:99px;background:#123b35;color:var(--accent);font-size:11px;white-space:nowrap}.rag-badge.ambiguous{background:#332817;color:var(--warn)}.rag-tech{grid-column:2/4;color:var(--muted);font-size:12px}.rag-tech summary{cursor:pointer}.rag-scores{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}.rag-score b{color:#cfe0ef}.rag-loading{min-height:170px;display:grid;place-items:center;color:var(--muted)}@media(max-width:640px){#searchModal{padding:8px}.rag-header,.rag-search-bar,.rag-results{padding-left:16px;padding-right:16px}.rag-search-bar{grid-template-columns:1fr}.rag-search-bar .button{height:44px}.rag-item{grid-template-columns:30px minmax(0,1fr)}.rag-badge{grid-column:2}.rag-tech{grid-column:2}}
`;document.head.appendChild(style)}
searchSource=function(id){document.querySelector('#searchModal')?.remove();const modal=document.createElement('div');modal.id='searchModal';modal.className='modal';modal.style.display='grid';modal.innerHTML=`<section class="dialog rag-dialog" role="dialog" aria-modal="true" aria-labelledby="ragTitle"><header class="rag-header"><div><div class="rag-kicker">SCHEMA RETRIEVAL</div><h2 id="ragTitle">测试知识库检索</h2><div class="meta">验证业务语言能否召回正确的表、字段与相近口径</div></div><button class="rag-close" aria-label="关闭" title="关闭" onclick="document.querySelector('#searchModal').remove()">×</button></header><div class="rag-search-bar"><input id="ragQuery" class="rag-query" value="医保基金支付和住院结算人次" placeholder="输入业务问题，例如：统计住院医保基金支付"><button class="button" onclick="runSchemaSearch('${id}')">开始检索</button></div><div id="ragResults" class="rag-results"><div class="rag-empty"><div><div class="rag-empty-icon">⌕</div><div>输入业务问题后开始混合检索</div><div class="meta">系统会综合语义向量、关键词与Schema关系进行召回</div></div></div></div></section>`;document.body.appendChild(modal);const input=$('#ragQuery');input.addEventListener('keydown',event=>{if(event.key==='Enter')runSchemaSearch(id)});setTimeout(()=>input.select(),0)}
runSchemaSearch=async function(id){const q=$('#ragQuery').value.trim(),box=$('#ragResults');if(!q)return;box.innerHTML='<div class="rag-loading"><span>正在进行关键词与向量混合检索…</span></div>';try{const rows=await api(`/api/v1/data-sources/${id}/knowledge/search?q=${encodeURIComponent(q)}`),visible=rows.slice(0,10),ambiguous=visible.some(v=>v.requires_confirmation);const warning=ambiguous?'<div class="rag-warning"><b>检测到相近的业务口径</b><div>多个字段的匹配程度非常接近，正式查询时应使用认证指标或由用户确认，不能直接采用第一名。</div></div>':'';box.innerHTML=warning+(visible.length?`<div class="rag-count">共召回 ${rows.length} 个候选，展示前 ${visible.length} 个</div>`+visible.map((v,i)=>{const raw=v.metadata?.column_comment||v.metadata?.table_comment||v.metadata?.comment||'',name=v.business_name||raw.split('；')[0]||v.object_key;return`<article class="rag-item"><div class="rag-rank">${i+1}</div><div><div class="rag-name">${esc(name)}</div><div class="rag-source">${esc(v.schema_name)}.${esc(v.table_name)}${v.column_name?'.'+esc(v.column_name):''}</div><div class="rag-description">${esc(raw||v.content)}</div></div><span class="rag-badge ${v.requires_confirmation?'ambiguous':''}">${v.requires_confirmation?'待确认口径':esc(v.match_level)}</span><details class="rag-tech"><summary>技术匹配详情</summary><div class="rag-scores"><span class="rag-score">综合 <b>${v.score}</b></span><span class="rag-score">向量 <b>${v.vector_score}</b></span><span class="rag-score">关键词 <b>${v.lexical_score}</b></span></div><div class="rag-source">${esc(v.object_key)}</div></details></article>`}).join(''):'<div class="rag-empty"><div>没有召回相关Schema，请补充更明确的业务名称。</div></div>')}catch(e){box.innerHTML=`<div class="rag-empty"><div style="color:var(--danger)">${esc(e.message)}</div></div>`}}
const syncStageText={queued:'等待后台执行',connecting:'正在连接数据源',catalog_scanned:'Schema扫描完成',embedding:'正在生成向量',activating:'正在激活知识库版本',ready:'同步完成',failed:'同步失败'};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function pollSync(id,jobId){const box=$(`#job-${id}`);for(;;){const job=await api(`/api/v1/data-sources/${id}/sync/latest`);if(!job||job.id!==jobId){await wait(800);continue}box.innerHTML=`<div class="meta">${esc(syncStageText[job.stage]||job.stage)} · ${job.progress}%</div><div class="progress"><i style="width:${Math.max(0,Math.min(100,job.progress))}%"></i></div>${job.table_count?`<div class="meta">${job.table_count}张表 · ${job.column_count}个字段 · ${job.document_count}篇文档</div>`:''}`;if(job.status==='completed'){await load();return}if(job.status==='failed'){box.innerHTML=`<div style="color:var(--danger)">同步失败：${esc(job.error_message||'未知错误')}</div>`;return}await wait(1000)}}
syncSource=async function(id){const box=$(`#job-${id}`);box.innerHTML='<div class="meta">正在提交后台同步任务…</div><div class="progress"><i style="width:3%"></i></div>';try{const job=await api(`/api/v1/data-sources/${id}/sync`,{method:'POST'});box.innerHTML=`<div class="meta">${job.duplicate?'已有任务正在执行，继续显示其进度':'任务已提交到后台'}</div><div class="progress"><i style="width:${job.progress||3}%"></i></div>`;await pollSync(id,job.job_id)}catch(e){box.innerHTML=`<div style="color:var(--danger)">${esc(e.message)}</div>`}}
installRagStyles();
</script></body></html>
