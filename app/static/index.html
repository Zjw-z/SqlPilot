const $=s=>document.querySelector(s);let conversationId=null,currentPlan=null,busy=false;function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function bubble(role,text,type='text'){const row=document.createElement('div');row.className=`message-row ${role==='user'?'user-row':'assistant-row'}`;const avatar=document.createElement('div');avatar.className=`avatar ${role==='user'?'user-avatar':'ai-avatar'}`;avatar.textContent=role==='user'?'我':'AI';avatar.setAttribute('aria-label',role==='user'?'我的头像':'SQLPilot AI头像');const d=document.createElement('div');d.className=`bubble ${role}`;d.innerHTML=`<div class="meta">${role==='user'?'我':'SQLPilot AI'}</div><div>${escapeHtml(text)}</div>`;row.append(avatar,d);$('#messages').appendChild(row);$('#messages').scrollTop=$('#messages').scrollHeight;return d}async function api(path,options={}){const r=await fetch(path,{headers:{'content-type':'application/json',...(options.headers||{})},...options});const body=await r.json();if(body.error)throw new Error(body.error.message);return body.data}async function init(){try{const h=await api('/api/v1/health');$('#health').textContent=h.status==='ready'?'百炼需求分析服务已就绪':'需要配置百炼模型';if(h.status!=='ready')$('#health').className='health error'}catch(e){$('#health').textContent=e.message}}

function installExpansionUi(){const side=$('.side'),heading=side?.querySelector('h2');if(!side||!heading||$('#expandAnalysis'))return;const wrap=document.createElement('div');wrap.className='side-heading';heading.before(wrap);wrap.appendChild(heading);const button=document.createElement('button');button.id='expandAnalysis';button.className='expand-button';button.type='button';Object.assign(button.style,{position:'fixed',top:'78px',right:'18px',zIndex:'30'});button.innerHTML=expandIcon;button.title='展开分析区';button.setAttribute('aria-label','展开分析区');button.setAttribute('aria-expanded','false');button.onclick=toggleAnalysis;side.appendChild(button);document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('.layout').classList.contains('analysis-expanded'))toggleAnalysis(false)});installResizeUi();installAdminLink()}

function installResizeUi(){const layout=$('.layout');if(!layout||$('#columnResizeHandle'))return;const style=document.createElement('style');style.textContent='.layout{position:relative;grid-template-columns:var(--chat-ratio,57.5%) 1fr}.resize-handle{position:absolute;z-index:25;top:0;bottom:0;left:calc(var(--chat-ratio,57.5%) - 5px);width:10px;cursor:col-resize;touch-action:none}.resize-handle::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:var(--line);transition:.15s ease}.resize-handle:hover::before,.resize-handle.dragging::before,.resize-handle:focus-visible::before{background:var(--accent);box-shadow:0 0 0 2px #36d6a522}.resize-handle:focus-visible{outline:none}.analysis-expanded .resize-handle{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr!important}.resize-handle{display:none}}';document.head.appendChild(style);const saved=Number(localStorage.getItem('sqlpilot-chat-ratio'));setColumnRatio(Number.isFinite(saved)&&saved>=30&&saved<=75?saved:57.5,false);const handle=document.createElement('div');handle.id='columnResizeHandle';handle.className='resize-handle';handle.setAttribute('role','separator');handle.setAttribute('aria-label','调整聊天区和分析区宽度');handle.setAttribute('aria-orientation','vertical');handle.tabIndex=0;layout.appendChild(handle);let dragging=false;const move=event=>{if(!dragging)return;const rect=layout.getBoundingClientRect();setColumnRatio((event.clientX-rect.left)/rect.width*100)};const stop=()=>{if(!dragging)return;dragging=false;handle.classList.remove('dragging');document.body.style.userSelect='';handle.releasePointerCapture?.(handle._pointerId)};handle.addEventListener('pointerdown',event=>{dragging=true;handle._pointerId=event.pointerId;handle.setPointerCapture?.(event.pointerId);handle.classList.add('dragging');document.body.style.userSelect='none'});handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',stop);handle.addEventListener('pointercancel',stop);handle
