<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务口径中心 · SQLPilot</title><style>
:root{--bg:#071423;--panel:#102237;--panel2:#0b1b2e;--line:#29435e;--text:#edf6ff;--muted:#8faac2;--green:#35d4ad;--warn:#f6bd4b;--danger:#ff7d86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:21px;font-weight:800}.brand span{color:var(--green)}a{color:#bcd7ef;text-decoration:none;margin-left:20px}.page{padding:26px;max-width:1500px;margin:auto}.intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.intro h1{margin:0 0 6px;font-size:28px}.muted{color:var(--muted)}select,input,textarea{width:100%;background:#09192b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none}textarea{min-height:78px;resize:vertical}.source{width:360px}.shell{display:grid;grid-template-columns:210px minmax(480px,1fr) 360px;gap:18px}.nav,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}.nav{padding:10px;height:max-content;position:sticky;top:16px}.tab{width:100%;border:0;background:transparent;color:#b8cce0;text-align:left;padding:13px;border-radius:10px;cursor:pointer;margin:2px 0}.tab.active{background:#173752;color:var(--green);font-weight:700}.panel{padding:20px}.panel h2{margin:0;font-size:19px}.head,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.head{margin-bottom:16px}.btn{border:0;background:var(--green);color:#042119;font-weight:700;padding:10px 15px;border-radius:10px;cursor:pointer}.btn.secondary{background:transparent;color:#c8dcf0;border:1px solid var(--line)}.cards{display:grid;gap:10px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}.card:hover{border-color:#4d708f}.badge{font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:20px;color:var(--muted)}.badge.certified{color:var(--green);border-color:#28765f}.badge.draft{color:var(--warn)}.empty{padding:42px 10px;text-align:center;color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;color:#a9bfd3;margin-bottom:5px;font-size:13px}.actions{display:flex;gap:10px;margin-top:16px}.notice{margin-top:12px;min-height:24px;color:var(--green)}.side-card{padding:13px 0;border-bottom:1px solid var(--line)}.kind-desc{padding:12px;background:#0a192a;border-radius:10px;color:#bdd0e1;margin-bottom:16px}@media(max-width:1100px){.shell{grid-template-columns:180px 1fr}.aside{grid-column:1/-1}}@media(max-width:720px){.shell{display:block}.nav{position:static;margin-bottom:14px}.form{grid-template-columns:1fr}.source{width:100%}.intro{display:block}}
</style></head><body><header class="top"><div class="brand"><span>SQL</span>Pilot · 业务口径中心</div><div><a href="/admin/data-sources">数据源</a><a href="/admin/schema">Schema</a><a href="/">返回查询</a></div></header><main class="page"><div class="intro"><div><h1>业务口径配置</h1><div class="muted">认证定义优先于模型和RAG；确认历史只用于审核参考，不会自动升级为认证口径。业务人员维护定义，数据负责人认证后才进入查询链路。</div></div><select id="source" class="source"></select></div><div class="shell"><nav class="nav" id="tabs"></nav><section class="panel"><div class="head"><div><h2 id="title"></h2><div id="subtitle" class="muted"></div></div><button class="btn" onclick="newItem()">新增配置</button></div><div id="definitions" class="cards"></div></section><aside class="aside"><div class="panel"><h2 id="formTitle">新增配置</h2><div id="kindDesc" class="kind-desc"></div><div class="form"><div class="field"><label>业务名称</label><input id="label" placeholder="例如：医保基金支付总额"></div><div class="field"><label>稳定标识</label><input id="key" placeholder="例如：fund_pay_total"></div><div class="field"><label>状态</label><select id="status"><option value="draft">草稿（不生效）</option><option value="certified">已认证（正式生效）</option><option value="disabled">停用</option></select></div><div class="field"><label>说明</label><input id="description" placeholder="口径解释或维护备注"></div></div><div id="dynamic" class="form" style="margin-top:12px"></div><div class="actions"><button class="btn" onclick="saveDefinition()">保存配置</button><button class="btn secondary" onclick="newItem()">清空</button></div><div id="message" class="notice"></div></div><div class="panel" style="margin-top:16px"><h2>用户确认观察</h2><div class="muted">仅供发现常用口径，不会自动升级认证。</div><div id="observations"></div></div></aside></div></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let definitions=[],observations=[],currentKind='metric';
const kinds={metric:{title:'指标管理',sub:'定义字段、聚合方式和去重口径',desc:'规范基金支付总额、医疗总费用、结算人次等指标。',fields:[['schema_name','Schema','nhsa'],['table_name','数据表','setl_d'],['column_name','指标字段','fund_pay_sumamt'],['aggregation','聚合方式','select','sum|count|count_distinct|avg|min|max'],['dedup_key','去重主键（可选）','setl_id']]},dimension:{title:'维度与时间',sub:'定义分析维度和默认时间字段',desc:'维护机构、月份等维度，并明确结算、入院或出院时间。',fields:[['schema_name','Schema','nhsa'],['table_name','数据表','setl_d'],['column_name','维度字段','setl_time'],['aggregation','字段类型','select','none']]},value_set:{title:'码值字典',sub:'维护业务名称到数据库码值的映射',desc:'例如将住院映射为客户数据库实际使用的六类代码。',fields:[['field','对应字段','nhsa.setl_d.med_type'],['values','码值映射（每行：名称=码值1,码值2）','textarea','住院=21,22,23,24,52,92']]},business_rule:{title:'数据规则',sub:'维护时间、有效记录和去重规则',desc:'显式维护有效、退费、撤销、中途结算及默认时间规则。',fields:[['rule_type','规则类型','select','time_semantics|record_scope|deduplication'],['field','作用字段','nhsa.setl_d.setl_time'],['operator','运算方式','select','use_as_default|eq|ne|in|not_in|distinct_by'],['value','规则值','settlement_time']]},join:{title:'表关系',sub:'维护多表连接及基数',desc:'连接基数和去重策略用于防止一对多连接重复聚合。',fields:[['source_table','左表','nhsa.setl_d'],['source_column','左表字段','fixmedins_code'],['target_table','右表','nhsa.fixmedins'],['target_column','右表字段','fixmedins_code'],['cardinality','连接基数','select','1:1|1:N|N:1|N:N'],['dedup_strategy','防重复策略（可选）','none']]},golden_query:{title:'对账用例',sub:'沉淀有权威答案的验收问题',desc:'用于回归评测和上线对账，不会直接改变查询SQL。',fields:[['question','业务问题','textarea','统计2025年各月医保基金支付总额'],['expected','预期结果（每行：项目=值）','textarea','row_count=12\ntotal=1000000'],['notes','权威来源或核对说明','textarea','与2025年度财务月报核对']]}};
async function api(path,options={}){const r=await fetch(path,{headers:{'content-type':'application/json'},...options}),b=await r.json();if(!r.ok||b.error)throw new Error(b.error?.message||`请求失败（${r.status}）`);return b.data}
function fieldHtml(f){const[id,label,type='text',options='']=f;if(type==='select')return`<div class="field"><label>${label}</label><select id="f_${id}">${options.split('|').map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`;if(type==='textarea')return`<div class="field full"><label>${label}</label><textarea id="f_${id}" placeholder="${esc(options)}"></textarea></div>`;return`<div class="field"><label>${label}</label><input id="f_${id}" placeholder="${esc(type)}"></div>`}
function selectKind(kind){currentKind=kind;document.querySelectorAll('.tab').forEach(v=>v.classList.toggle('active',v.dataset.kind===kind));$('#title').textContent=kinds[kind].title;$('#subtitle').textContent=kinds[kind].sub;$('#kindDesc').textContent=kinds[kind].desc;$('#dynamic').innerHTML=kinds[kind].fields.map(fieldHtml).join('');newItem();renderList()}
function newItem(){$('#formTitle').textContent='新增'+kinds[currentKind].title.replace('管理','');['label','key','description'].forEach(id=>$('#'+id).value='');$('#status').value='draft';kinds[currentKind].fields.forEach(f=>{const el=$('#f_'+f[0]);if(el)el.value=''});$('#message').textContent=''}
function renderList(){const rows=definitions.filter(v=>v.kind===currentKind);$('#definitions').innerHTML=rows.length?rows.map(v=>`<article class="card" onclick="editItem('${v.id}')"><div class="row"><b>${esc(v.label)}</b><span class="badge ${esc(v.status)}">${v.status==='certified'?'已认证':v.status==='draft'?'草稿':'已停用'} · V${v.version}</span></div><div class="muted">${esc(v.semantic_key)}${v.definition.description?' · '+esc(v.definition.description):''}</div></article>`).join(''):`<div class="empty">还没有配置，点击“新增配置”开始维护。</div>`}
function editItem(id){const v=definitions.find(x=>x.id===id);if(!v)return;$('#formTitle').textContent='编辑配置';$('#label').value=v.label;$('#key').value=v.semantic_key;$('#status').value=v.status;$('#description').value=v.definition.description||'';const d=v.definition,b=d.binding||{};kinds[currentKind].fields.forEach(f=>{const el=$('#f_'+f[0]);if(!el)return;let value=b[f[0]]??d[f[0]]??'';if(f[0]==='values')value=Object.entries(d.values||{}).map(([k,x])=>`${k}=${Array.isArray(x)?x.join(','):x}`).join('\n');if(f[0]==='expected')value=Object.entries(d.expected||{}).map(([k,x])=>`${k}=${x}`).join('\n');el.value=value});$('#message').textContent=''}
function pairs(text,listValues=false){const out={};text.split(/\n/).map(v=>v.trim()).filter(Boolean).forEach(line=>{const i=line.indexOf('=');if(i<1)return;const k=line.slice(0,i).trim(),raw=line.slice(i+1).trim();out[k]=listValues?raw.split(/[,，]/).map(x=>x.trim()).filter(Boolean):(/^\d+(\.\d+)?$/.test(raw)?Number(raw):raw)});return out}
function buildDefinition(){const value=id=>$('#f_'+id)?.value.trim()||'',d={description:$('#description').value.trim()};if(['metric','dimension'].includes(currentKind)){d.binding={role:currentKind,key:$('#key').value.trim(),label:$('#label').value.trim(),object_key:[value('schema_name'),value('table_name'),value('column_name')].join('.'),schema_name:value('schema_name'),table_name:value('table_name'),column_name:value('column_name'),aggregation:value('aggregation')||'none'};if(value('dedup_key'))d.dedup_key=value('dedup_key')}else kinds[currentKind].fields.forEach(f=>d[f[0]]=value(f[0]));if(currentKind==='value_set')d.values=pairs(value('values'),true);if(currentKind==='golden_query')d.expected=pairs(value('expected'));return d}
async function saveDefinition(){try{$('#message').style.color='var(--green)';const payload={kind:currentKind,status:$('#status').value,semantic_key:$('#key').value.trim(),label:$('#label').value.trim(),definition:buildDefinition()};await api(`/api/v1/data-sources/${$('#source').value}/semantic-definitions`,{method:'PUT',body:JSON.stringify(payload)});const active=['metric','dimension','value_set'].includes(currentKind);$('#message').textContent='保存成功；'+(payload.status==='certified'?(active?'该认证口径已进入正式查询链路。':'该配置已认证，可供查询治理与后续编译能力使用。'):'当前为草稿，不影响正式查询。');await loadAll()}catch(e){$('#message').style.color='var(--danger)';$('#message').textContent=e.message}}
async function loadAll(){const id=$('#source').value;if(!id)return;[definitions,observations]=await Promise.all([api(`/api/v1/data-sources/${id}/semantic-definitions`),api(`/api/v1/data-sources/${id}/semantic-observations`)]);renderList();$('#observations').innerHTML=observations.length?observations.slice(0,8).map(v=>`<div class="side-card"><div class="row"><b>${esc(v.label||v.semantic_key)}</b><span class="badge">${v.confirmation_count} 次</span></div><div class="muted">${esc(v.object_key)}</div></div>`).join(''):'<div class="empty">暂无确认记录</div>'}
async function init(){const [sourceRows,capabilities]=await Promise.all([api('/api/v1/data-sources'),api('/api/v1/semantic-layer/compiler-capabilities')]);const sources=sourceRows.filter(v=>v.status==='ready');$('#source').innerHTML=sources.map(v=>`<option value="${esc(v.id)}">${esc(v.name)} · ${esc(v.database_name)}</option>`).join('');$('#source').title=`SQL编译策略：${capabilities.strategy}`;$('#source').onchange=loadAll;$('#tabs').innerHTML=Object.entries(kinds).map(([k,v])=>`<button class="tab" data-kind="${k}" onclick="selectKind('${k}')">${v.title}</button>`).join('');selectKind('metric');await loadAll()}init().catch(e=>{$('#definitions').innerHTML=`<div class="empty" style="color:var(--danger)">${esc(e.message)}</div>`});
</script></body></html>
