<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · SQLPilot</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d2e;--line:#263a52;--muted:#91a6bd;--text:#edf5fc;--accent:#36d6a5;--danger:#ff7b7b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 25% 20%,#12354b 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}.card{width:min(420px,calc(100vw - 32px));padding:34px;border:1px solid var(--line);border-radius:20px;background:#0c1929;box-shadow:0 24px 70px #0008}.brand{font-size:23px;font-weight:800}.brand span{color:var(--accent)}h1{margin:24px 0 2px;font-size:27px}.sub{color:var(--muted);margin-bottom:24px}label{display:block;margin:14px 0 5px;color:#cbd8e5}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#091523;color:var(--text);font:inherit}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:11px;background:var(--accent);color:#05231a;font-weight:800;font:inherit;cursor:pointer}button:disabled{opacity:.5}.error{min-height:24px;margin-top:12px;color:var(--danger)}.tip{margin-top:18px;color:var(--muted);font-size:12px}
</style></head><body><main class="card"><div class="brand"><span>SQL</span>Pilot</div><h1>欢迎回来</h1><div class="sub">登录后只能访问属于你的查询记录</div><form id="form"><label for="username">用户名</label><input id="username" autocomplete="username" required autofocus><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">登录</button><div id="error" class="error"></div></form><div class="tip">首次部署账号由系统管理员配置；首次登录后请修改初始密码。</div></main><script>
const form=document.querySelector('#form'),error=document.querySelector('#error'),button=document.querySelector('#submit');form.onsubmit=async e=>{e.preventDefault();error.textContent='';button.disabled=true;try{const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})}),b=await r.json();if(!r.ok||b.error)throw new Error(b.error?.message||'登录失败');location.href=new URLSearchParams(location.search).get('next')||'/'}catch(e){error.textContent=e.message}finally{button.disabled=false}};
</script></body></html>
